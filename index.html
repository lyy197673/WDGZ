<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>在线文档盖章</title>
    <!-- 图标库 FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js 渲染库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- jsPDF 导出库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 浅色液态背景光晕 -->
    <div class="glass-bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- 通用弹窗遮罩层 -->
    <div class="modal-backdrop" id="modal-backdrop"></div>

    <!-- 新增：导出格式选择弹窗 -->
    <div class="export-modal-card glass-panel" id="modal-export-format">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-file-export"></i> 选择导出格式</h3>
            <button class="icon-btn btn-close-export-modal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="export-format-options">
            <div class="format-card active" data-format="pdf">
                <div class="format-card-left">
                    <div class="format-card-icon"><i class="fa-regular fa-file-pdf"></i></div>
                    <div class="format-card-info">
                        <h4>PDF 高清文档 (推荐)</h4>
                        <p>适合多页合同，保持矢量清晰度</p>
                    </div>
                </div>
                <div class="format-radio"></div>
            </div>

            <div class="format-card" data-format="png">
                <div class="format-card-left">
                    <div class="format-card-icon"><i class="fa-regular fa-image"></i></div>
                    <div class="format-card-info">
                        <h4>PNG 高清图片</h4>
                        <p>适合透明背景或单页图片导出</p>
                    </div>
                </div>
                <div class="format-radio"></div>
            </div>

            <div class="format-card" data-format="jpg">
                <div class="format-card-left">
                    <div class="format-card-icon"><i class="fa-regular fa-file-image"></i></div>
                    <div class="format-card-info">
                        <h4>JPG 压缩图片</h4>
                        <p>文件体积小，适合日常微信快速传输</p>
                    </div>
                </div>
                <div class="format-radio"></div>
            </div>
        </div>

        <div class="modal-footer">
            <button id="btn-confirm-export" class="glass-btn primary full-width">
                <i class="fa-solid fa-download"></i> 确认导出
            </button>
        </div>
    </div>

    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="top-bar glass-panel">
            <div class="brand">
                <div class="brand-logo"><i class="fa-solid fa-stamp"></i></div>
                <span class="brand-title">在线文档盖章 <span class="badge">AAA软件开发刘桑</span></span>
            </div>
            
            <div class="toolbar-center">
                <button id="btn-toggle-left-sidebar" class="glass-btn xs primary-subtle mobile-only">
                    <i class="fa-solid fa-box-archive"></i> 印章库
                </button>

                <input type="file" id="file-input-doc" accept="image/*,application/pdf" style="display: none;">

                <button id="btn-toggle-right-sidebar" class="glass-btn xs primary-subtle mobile-only">
                    <i class="fa-solid fa-sliders"></i> 微调
                </button>
            </div>

            <div class="toolbar-right desktop-only">
                <div id="dir-status" class="status-badge">
                    <i class="fa-solid fa-arrows-rotate fa-spin"></i> 读取印章中...
                </div>
            </div>
        </header>

        <main class="main-workspace">
            <!-- 左侧：印章库面板 -->
            <aside class="sidebar sidebar-left glass-panel modal-card" id="sidebar-left">
                <div class="sidebar-header">
                    <h3><i class="fa-solid fa-box-archive"></i> 印章库</h3>
                    <div class="sidebar-actions">
                        <button id="btn-change-dir" class="glass-btn xs primary-subtle" title="更改识别目录">
                            <i class="fa-solid fa-folder-gear"></i> 选择/更改印章目录
                        </button>
                        <button id="btn-toggle-all-folders" class="icon-btn" title="全部展开/折叠">
                            <i class="fa-solid fa-layer-group"></i>
                        </button>
                        <button class="icon-btn mobile-only btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <input type="file" id="folder-input-fallback" webkitdirectory directory multiple style="display: none;">
                </div>

                <div class="temp-stamp-section">
                    <button id="btn-add-temp-stamp" class="glass-btn accent-green full-width">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 临时上传单个印章
                    </button>
                    <input type="file" id="input-temp-stamp" accept="image/*" style="display: none;">
                </div>
                
                <div class="search-box glass-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="stamp-search" placeholder="搜索印章...">
                </div>

                <div class="stamp-categories" id="stamp-categories">
                    <!-- 印章列表 -->
                </div>
            </aside>

            <!-- 中间：主画布工作区 -->
            <section class="viewport-container" id="viewport">
                <!-- 悬浮缩放控制胶囊 -->
                <div class="floating-zoom-controls glass-pill">
                    <button id="btn-zoom-out" class="icon-btn"><i class="fa-solid fa-minus"></i></button>
                    <span id="zoom-level">100%</span>
                    <button id="btn-zoom-in" class="icon-btn"><i class="fa-solid fa-plus"></i></button>
                    <button id="btn-zoom-reset" class="icon-btn"><i class="fa-solid fa-expand"></i></button>
                </div>

                <div class="canvas-stage" id="canvas-stage">
                    <canvas id="doc-canvas"></canvas>
                    <div id="stamp-layer" class="stamp-layer"></div>
                </div>

                <!-- 上传提示卡片 -->
                <div class="drop-zone-overlay" id="drop-zone-overlay">
                    <div class="drop-zone-card glass-panel" id="btn-trigger-drop-zone">
                        <div class="drop-icon-wrapper">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <h2>单击或拖拽文件到此处上传文档</h2>
                        <p>支持 PNG、JPG、WEBP、PDF 格式文档</p>
                    </div>
                </div>

                <!-- 屏幕底部居中悬浮 Dock -->
                <div class="bottom-dock-wrapper">
                    <div class="bottom-dock glass-pill">
                        <!-- 页码导航 (仅多页 PDF 显示) -->
                        <div class="dock-segment page-controls" id="page-controls" style="display: none;">
                            <button id="btn-prev-page" class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
                            <span id="page-info">1/1</span>
                            <button id="btn-next-page" class="icon-btn"><i class="fa-solid fa-chevron-right"></i></button>
                            <div class="dock-divider"></div>
                        </div>

                        <!-- 重置清空组 -->
                        <div class="dock-segment doc-actions">
                            <button id="btn-reset-doc" class="glass-btn danger-subtle" title="清空文档，重新选择下一张">
                                <i class="fa-solid fa-arrow-rotate-left"></i> 换一张
                            </button>
                            <button id="btn-clear-stamps" class="glass-btn warning-subtle" title="清除当前页面所有印章">
                                <i class="fa-solid fa-eraser"></i> 清除印章
                            </button>
                            <div class="dock-divider"></div>
                        </div>

                        <!-- 合并后的单个导出按钮 -->
                        <div class="dock-segment export-segment">
                            <button id="btn-open-export-modal" class="glass-btn primary">
                                <i class="fa-solid fa-download"></i> 导出文档
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 右侧：印章微调面板 -->
            <aside class="sidebar sidebar-right glass-panel modal-card" id="sidebar-right">
                <div class="sidebar-header">
                    <h3><i class="fa-solid fa-sliders"></i> 印章微调面板</h3>
                    <button class="icon-btn mobile-only btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div id="prop-content" class="prop-content">
                    <div class="empty-tip" id="prop-empty-tip">
                        <i class="fa-solid fa-arrow-pointer"></i>
                        <p>请点击画布中的印章进行调整</p>
                    </div>

                    <div class="prop-controls" id="prop-controls" style="display: none;">
                        <div class="prop-group">
                            <div class="prop-label"><span>缩放大小</span><span id="prop-scale-val" class="val-tag">100%</span></div>
                            <input type="range" id="prop-scale" min="10" max="300" value="100">
                        </div>

                        <div class="prop-group">
                            <div class="prop-label"><span>旋转角度</span><span id="prop-rotate-val" class="val-tag">0°</span></div>
                            <input type="range" id="prop-rotate" min="-180" max="180" value="0">
                            <div class="quick-buttons">
                                <button class="glass-btn xs" id="btn-rot--90">-90°</button>
                                <button class="glass-btn xs" id="btn-rot-0">复位</button>
                                <button class="glass-btn xs" id="btn-rot-90">+90°</button>
                            </div>
                        </div>

                        <div class="prop-group">
                            <div class="prop-label"><span>透明度</span><span id="prop-opacity-val" class="val-tag">100%</span></div>
                            <input type="range" id="prop-opacity" min="10" max="100" value="100">
                        </div>

                        <div class="prop-group">
                            <div class="prop-label"><span>融合模式 (真实盖章效果)</span></div>
                            <select id="prop-blend" class="glass-select">
                                <option value="multiply" selected>正片叠底 Multiply (推荐)</option>
                                <option value="normal">正常覆盖 Normal</option>
                                <option value="darken">变暗 Darken</option>
                                <option value="color-burn">颜色加深 Color Burn</option>
                            </select>
                        </div>

                        <div class="prop-group action-buttons">
                            <button id="btn-delete-stamp" class="glass-btn danger full-width">
                                <i class="fa-solid fa-trash-can"></i> 删除选中的印章
                            </button>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
